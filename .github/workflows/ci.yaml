name: CI

env:
  BINARY_NAME: instance-tag-discovery-linux

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.17"

      - name: Run tests
        run: go test .
      - name: Vet
        run: go vet .
  upload:
    runs-on: ubuntu-latest
    needs: [test]

    permissions:
      contents: read

      # These permissions are required by guardian/actions-riff-raff...
      id-token: write # ...to exchange an OIDC JWT ID token for AWS credentials
      pull-requests: write #...to comment on PRs

    steps:
      - uses: actions/checkout@v2
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.17"
      - name: Build
        run: |
          GOOS=linux GOARCH=arm64 go build -o $BINARY_NAME-arm64 main.go
          GOOS=linux GOARCH=amd64 go build -o $BINARY_NAME-amd64 main.go

      - uses: guardian/actions-riff-raff@v4.3.1
        with:
          projectName: deploy::instance-tag-discovery
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          contentDirectories: |
            instance-tag-discovery:
              - ${{ env.BINARY_NAME }}-arm64
              - ${{ env.BINARY_NAME }}-amd64
          config: |
            stacks:
              - deploy
            regions:
              - eu-west-1
            allowedStages:
              - CODE
              - PROD
            deployments:
              instance-tag-discovery:
                type: aws-s3
                parameters:
                  bucket: amigo-data
                  cacheControl: private
                  publicReadAcl: false
